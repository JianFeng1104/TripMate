{% extends "base.html" %}
{% block title %}登录 · TripMate{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <p class="eyebrow">WELCOME BACK</p>
    <h1>继续寻找下一段同行。</h1>
    <p>登录后查看公开计划、管理申请状态，并回顾你的旅行安排。</p>
  </div>
  <form class="form-card" method="post" novalidate>
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>用户名或邮箱
      <input name="identity" autocomplete="username" required value="{{ request.form.get('identity', '') }}">
    </label>
    <label>密码
      <input type="password" name="password" autocomplete="current-password" required>
    </label>
    <button class="button button-primary button-full" type="submit">登录</button>
    <p class="form-footnote">还没有账号？<a href="{{ url_for('auth.register') }}">免费注册</a></p>
  </form>
</section>
{% endblock %}
