{% extends "base.html" %}
{% block title %}创建账号 · TripMate{% endblock %}
{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <p class="eyebrow">JOIN TRIPMATE</p>
    <h1>先认识你，再认识旅程。</h1>
    <p>只填写完成同行闭环所必需的信息。我们不要求真实姓名、证件或精确住址。</p>
  </div>
  <form class="form-card" method="post" novalidate>
    <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
    <label>用户名 <span>3–30 个字符</span>
      <input name="username" autocomplete="username" required maxlength="30" value="{{ request.form.get('username', '') }}">
    </label>
    <label>邮箱
      <input type="email" name="email" autocomplete="email" required maxlength="120" value="{{ request.form.get('email', '') }}">
    </label>
    <label>密码 <span>至少 8 位，含字母和数字</span>
      <input type="password" name="password" autocomplete="new-password" required minlength="8">
    </label>
    <label>个人简介 <span>可选，最多 500 字</span>
      <textarea name="bio" maxlength="500" rows="4" placeholder="例如：喜欢城市漫步、摄影和当地美食。">{{ request.form.get('bio', '') }}</textarea>
    </label>
    <button class="button button-primary button-full" type="submit">创建账号</button>
    <p class="form-footnote">已有账号？<a href="{{ url_for('auth.login') }}">直接登录</a></p>
  </form>
</section>
{% endblock %}
